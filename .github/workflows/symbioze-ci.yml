# SYMBIOZE: build the BetaFPV Air65 (STM32G473, target BETAFPVG473) on the
# Betaflight 4.5.6 base + Symbioze OSD Art elements. Pushing to symbioze-osd-4.5
# builds it and publishes the hex to the symbioze-air65-g473-v1 release.
name: Symbioze Air65

on:
  push:
    branches:
      - symbioze-osd-4.5
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to build'
        default: 'BETAFPVG473'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ github.event.inputs.target || 'BETAFPVG473' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Init config submodule
        run: git submodule update --init -- src/config

      - name: Hydrate configuration
        run: make configs

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: tools
          key: ${{ runner.os }}-45-tools-${{ hashFiles('mk/tools.mk') }}

      - name: Install ARM toolchain
        run: make arm_sdk_install

      - name: Build
        run: make ${{ github.event.inputs.target || 'BETAFPVG473' }}

      - name: Stage hex
        run: |
          ls -la obj/*.hex
          mkdir -p out
          for f in obj/*.hex; do cp "$f" "out/$(basename "${f%.hex}")_SYMBIOZE.hex"; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: symbioze-air65-${{ github.event.inputs.target || 'BETAFPVG473' }}
          path: out/*.hex

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=symbioze-air65-g473-v1
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Symbioze OSD — BetaFPV Air65 (BETAFPVG473)" --prerelease \
            --notes "BetaFPV Air65 (STM32G473, target BETAFPVG473) on Betaflight 4.5.6 + Symbioze OSD Art elements (OSD_ART0-5: placeable glyph-block art, positionable anywhere on the OSD). Flash via Betaflight Configurator -> Load Firmware [Local], then re-upload your OSD font. Full custom-font + boot-logo + layout support."
          gh release upload "$TAG" out/*.hex --clobber
