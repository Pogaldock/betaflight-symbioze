# SYMBIOZE: build the BetaFPV Air65 (STM32G473, target BETAFPVG473) on the
# Betaflight 4.5.6 base + Symbioze OSD Art elements. Pushing to symbioze-osd-4.5
# builds it and publishes the hex to the symbioze-air65-g473-v1 release.
name: Symbioze Air65

on:
  push:
    branches:
      - symbioze-osd-4.5
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to build'
        default: 'BETAFPVG473'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ github.event.inputs.target || 'BETAFPVG473' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Init config submodule
        run: git submodule update --init -- src/config

      - name: Hydrate configuration
        run: make configs

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: tools
          key: ${{ runner.os }}-45-tools-${{ hashFiles('mk/tools.mk') }}

      - name: Install ARM toolchain
        run: make arm_sdk_install

      - name: Build
        run: make ${{ github.event.inputs.target || 'BETAFPVG473' }} EXTRA_FLAGS="-DUSE_TARGET_CONFIG -DSYMBIOZE_AIR65_DEFAULTS"

      - name: Stage hex
        run: |
          ls -la obj/*.hex
          mkdir -p out
          for f in obj/*.hex; do cp "$f" "out/$(basename "${f%.hex}")_SYMBIOZE.hex"; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: symbioze-air65-${{ github.event.inputs.target || 'BETAFPVG473' }}
          path: out/*.hex

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=symbioze-air65-g473-v6
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Symbioze OSD — BetaFPV Air65 v6: maps, stride, gauges, 10 slots" --prerelease \
            --notes "BetaFPV Air65 (BETAFPVG473) on Betaflight 4.5.6 + the full Symbioze OSD suite. v6 — the capacity release: 10 art slots (OSD ART 1-10 AUX boxes); osd_artN_stride (overlapping frames: stride=cols vertical scroller, rows=1 stride=1 ticker); CELL MAPS (osd_artN_mapped + osd_artN_mapstart + 384-byte artmap pool, artmap CLI command, included in diff/dump) so identical cells share one font slot; osd_artN_blink (native chip blink, zero glyph cost); osd_artN_source = TIME/THROTTLE/RSSI/BATTERY (data-driven frames = animated gauges). Plus v4 messages + custom armed text and the baked flying-ready factory config. Flash with Full chip erase."
          gh release upload "$TAG" out/*.hex --clobber
